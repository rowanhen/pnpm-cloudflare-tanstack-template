packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: true
  workerd: true

# Track the registry's latest releases, including versions published today.
minimumReleaseAge: 0

# Patch the esbuild bundled by Drizzle Kit's loader until its range is updated.
overrides:
  '@esbuild-kit/core-utils>esbuild': ^0.28.2
