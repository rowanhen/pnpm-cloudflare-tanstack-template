name: CI and deploy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:8787' }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'http://localhost:3000' }}
      VITE_DASHBOARD_URL: ${{ vars.VITE_DASHBOARD_URL || 'http://localhost:3001' }}
      VITE_SITE_NAME: ${{ vars.VITE_SITE_NAME || 'Cloudflare Starter' }}
      VITE_NOINDEX: ${{ vars.VITE_NOINDEX || 'true' }}
      VITE_APP_ENV: ${{ vars.VITE_APP_ENV || 'production' }}
      VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint && pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Save build outputs
        uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: |
            apps/api/dist/
            apps/marketing/dist/
            apps/dashboard/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.VITE_SITE_URL }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_MARKETING_PROJECT: ${{ vars.CLOUDFLARE_MARKETING_PROJECT }}
      CLOUDFLARE_DASHBOARD_PROJECT: ${{ vars.CLOUDFLARE_DASHBOARD_PROJECT }}
      WORKER_CONFIG: ${{ vars.CLOUDFLARE_WORKER_CONFIG }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      VITE_DASHBOARD_URL: ${{ vars.VITE_DASHBOARD_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified build
        uses: actions/download-artifact@v8
        with:
          name: production-build
          path: apps/

      - name: Configure deployment
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_MARKETING_PROJECT CLOUDFLARE_DASHBOARD_PROJECT WORKER_CONFIG VITE_API_URL VITE_SITE_URL VITE_DASHBOARD_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure $name in GitHub Actions settings before deploying."
              exit 1
            fi
          done
          printf '%s\n' "$WORKER_CONFIG" > apps/api/wrangler.ci.json

      - name: Apply migrations
        run: pnpm db:migrate:remote --config wrangler.ci.json

      - name: Deploy API
        run: pnpm exec wrangler deploy apps/api/dist/index.js --no-bundle --config apps/api/wrangler.ci.json

      - name: Deploy marketing
        run: pnpm --filter marketing exec wrangler pages deploy dist --project-name "$CLOUDFLARE_MARKETING_PROJECT" --branch main

      - name: Deploy dashboard
        run: pnpm --filter dashboard exec wrangler pages deploy dist --project-name "$CLOUDFLARE_DASHBOARD_PROJECT" --branch main
