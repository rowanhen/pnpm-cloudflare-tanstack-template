name: Build, Lint & Typecheck

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate API and reject drift (including new files)
        run: |
          pnpm api:generate
          test -z "$(git status --porcelain -- packages/contracts/src/generated apps/api/src/generated apps/dashboard/src/generated apps/api/src/features)"

      - name: Pre-commit parity checks
        run: pnpm run check

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser end-to-end tests
        run: pnpm test:browser

      - name: Development server end-to-end tests
        run: pnpm test:dev
